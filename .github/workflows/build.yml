name: Automated AI Build
on: [workflow_dispatch]

jobs:
  build:
    runs-on: windows-2022
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    - name: Restore NuGet Packages
      run: nuget restore FateInjector.sln

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Fate Injector
      run: msbuild FateInjector.sln /p:Configuration=Release /p:Platform=x64 /p:MissingDependencies=true
